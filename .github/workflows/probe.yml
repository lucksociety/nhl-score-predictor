name: Research data probe
on:
  push:
    branches: ['probe/model-data']
    paths: ['research/probe/fetch.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: pip install -r requirements.txt
      - name: Run the production skater fetch against the live feed
        run: python research/probe/fetch.py skatercode > research/probe/skatercode.log 2>&1 || true
      - name: Commit the result to this branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/probe && (git commit -m "probe: skater fetch diagnosis" || true) && git push origin HEAD:probe/model-data
