name: Discord /nhl

# 1) repository_dispatch (type nhl-command) from the Cloudflare Worker when someone runs /nhl.
#    client_payload: { token: <15-minute interaction token>, application_id, date?, dry_run? }
#    The interaction token is read from the event file and masked; it is never echoed or committed.
#    If the interaction reply fails, the board is posted to the channel webhook (secret DISCORD_WEBHOOK_URL).
# 2) workflow_dispatch: manual run; posts to the channel webhook only if "post" is checked.
on:
  repository_dispatch:
    types: [nhl-command]
  workflow_dispatch:
    inputs:
      day:
        description: 'today or tomorrow (ET)'
        default: today
        type: choice
        options: [today, tomorrow]
      post:
        description: 'Post the board to the Discord channel webhook'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  nhl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Read request (token masked)
        env:
          IN_DAY: ${{ inputs.day }}
          IN_POST: ${{ inputs.post }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            T=$(jq -r '.client_payload.token // empty' "$GITHUB_EVENT_PATH")
            [ -n "$T" ] && echo "::add-mask::$T"
            echo "DISCORD_INTERACTION_TOKEN=$T" >> "$GITHUB_ENV"
            echo "DISCORD_APP_ID=$(jq -r '.client_payload.application_id // empty' "$GITHUB_EVENT_PATH" | tr -cd '0-9')" >> "$GITHUB_ENV"
            D=$(jq -r '.client_payload.date // empty' "$GITHUB_EVENT_PATH" | tr -cd '0-9-')
            echo "DRY_RUN=$(jq -r '.client_payload.dry_run // false' "$GITHUB_EVENT_PATH" | tr -cd 'a-z')" >> "$GITHUB_ENV"
            echo "MODE=interaction" >> "$GITHUB_ENV"
          else
            if [ "$IN_DAY" = "tomorrow" ]; then D=$(TZ=America/New_York date -d tomorrow +%F); fi
            if [ "$IN_POST" = "true" ]; then echo "MODE=webhook" >> "$GITHUB_ENV"; echo "DRY_RUN=false" >> "$GITHUB_ENV"; else echo "DRY_RUN=true" >> "$GITHUB_ENV"; fi
          fi
          echo "SLATE_DATE=${D:-$(TZ=America/New_York date +%F)}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fresh schedule, goalies, Jupiter prices; retrain v4 (not committed)
        run: python scripts/update_data.py
      - name: Run the Monte Carlo (400k sims/game)
        run: node scripts/predict.js "$SLATE_DATE"
      - name: Preserve pre-game forecasts for prospective evaluation
        run: python3 scripts/model_learning.py --capture-only
      - uses: actions/upload-artifact@v4
        with:
          name: learning-${{ github.run_id }}
          path: learning/inbox.jsonl
          retention-days: 90
          if-no-files-found: error
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          F="data/predictions/$SLATE_DATE.json"
          if [ "$DRY_RUN" = "true" ]; then node scripts/discord_post.js "$F" --dry-run | head -c 1500; echo; echo "dry run: nothing posted"; exit 0; fi
          if [ "$MODE" = "webhook" ]; then node scripts/discord_post.js "$F" --webhook; else node scripts/discord_post.js "$F"; fi
      - name: Report failure to Discord
        if: failure() && env.MODE == 'interaction' && env.DRY_RUN != 'true'
        run: |
          curl -sS -X PATCH -H 'Content-Type: application/json' \
            -d '{"content":"🍀 Sorry, the NHL simulation failed this time. Try /nhl again in a minute."}' \
            "https://discord.com/api/v10/webhooks/$DISCORD_APP_ID/$DISCORD_INTERACTION_TOKEN/messages/@original" > /dev/null || true
