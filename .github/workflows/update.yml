name: Refresh data & deploy Pages

on:
  schedule:
    # Hourly 10 AM – 11 PM America/New_York (covers both EDT and EST), plus :30 runs 5–11 PM ET for goalie news.
    - cron: '0 14-23 * * *'
    - cron: '0 0-4 * * *'
    - cron: '30 21-23 * * *'
    - cron: '30 0-3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch schedule, odds, goalies, results
        run: python scripts/update_data.py
      - name: Commit data if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "data: refresh $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
